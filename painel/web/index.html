<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="painel-token" content="{{TOKEN}}">
<title>Painel do Funil</title>
<link rel="stylesheet" href="/style.css">
<script>
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<div style="max-width:640px;margin:48px auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif">'
        + '<h1 style="font-size:20px">Abra o painel pelo servidor</h1>'
        + '<p>Este arquivo não funciona aberto direto do Finder. No terminal, dentro da pasta do projeto, rode:</p>'
        + '<pre style="background:#f5f5f4;padding:12px;border-radius:6px">node painel/server.mjs</pre>'
        + '<p>O navegador abre sozinho em <code>http://127.0.0.1:4747/</code>. Se não abrir, copie o endereço que aparece no terminal.</p></div>';
    });
  }
</script>
</head>
<body>
<header>
  <h1>Painel do Funil</h1>
  <div id="diag" role="status"></div>
</header>
<div id="aviso" role="note">Atenção: o Claude Code roda aqui com Bash e acesso à web liberados, sem pedir confirmação. Conteúdo lido da web pode tentar executar comandos nesta máquina. Use o painel só no seu computador e só com projetos seus.</div>
<main>
  <aside id="lateral">
    <label>Projeto
      <select id="sel-projeto"></select>
    </label>
    <h2>Skills</h2>
    <input id="filtro-skill" type="search" placeholder="Filtrar skills">
    <ul id="lista-skills"></ul>
    <h2>Execuções</h2>
    <ul id="lista-runs"></ul>
  </aside>
  <section id="principal">
    <form id="form-nova" hidden>
      <div><strong id="nova-skill"></strong></div>
      <textarea id="nova-args" rows="3" placeholder="Instruções para a skill (opcional)"></textarea>
      <button type="submit">Rodar</button>
    </form>
    <div id="cabecalho-run"></div>
    <div id="log" aria-live="polite"></div>
    <form id="form-resposta" hidden>
      <textarea rows="2" placeholder="Responda ou peça um ajuste"></textarea>
      <button type="submit">Enviar</button>
    </form>
  </section>
  <aside id="arquivos">
    <h2>Arquivos</h2>
    <ul id="arvore"></ul>
    <div id="visualizador"></div>
  </aside>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
