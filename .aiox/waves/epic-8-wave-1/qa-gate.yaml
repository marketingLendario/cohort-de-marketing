findings: []

residual_risks:
  - id: P3-1
    severity: P3
    category: correctness
    file: "apps/academia-lendaria-ads-studio/src/lib/project-repository.ts:578-588"
    note: >-
      getActiveBrief usa .maybeSingle() sem garantia no schema de uma única revisão
      'active' por projeto (não há índice único parcial). Se duas revisões ficarem
      'active', maybeSingle lança e o erro é mapeado para not_found (mensagem
      enganosa, sem risco de dado). Invariante hoje mantida em nível de aplicação.
  - id: P3-2
    severity: P3
    category: test-coverage
    file: "apps/academia-lendaria-ads-studio/src/lib/project-repository.ts"
    note: >-
      Adapter TS validado via mappers puros + fake client + pgTAP contra RLS real;
      não há teste de integração ponta-a-ponta do adapter TS contra o Supabase
      local. Deferido para W2.1 (hidratação da UI via repository) — reconhecido no
      Dev Agent Record.
  - id: P3-3
    severity: P3
    category: operational
    file: "apps/academia-lendaria-ads-studio/server/app.ts:192-194"
    note: >-
      O slot de concorrência é liberado no finally quando run() lança por timeout,
      enquanto o processo filho ainda pode estar sendo encerrado (SIGKILL após
      killGraceMs). Sob timeout há janela breve de sub-contagem de concorrência.
      Não é falha de segurança; contabilidade imprecisa apenas no caminho de timeout.
  - id: P3-4
    severity: P3
    category: robustness
    file: "apps/academia-lendaria-ads-studio/server/local-skill-runner.ts:113-147"
    note: >-
      defaultCodexExecutor faz child.stdin.end(prompt) mesmo quando o spawn falha
      (ENOENT); um EPIPE em stdin pode emitir erro não tratado. Não exercitado nos
      testes (executor injetado nos testes). Robustez apenas no caminho de erro real
      do CLI.
  - id: P3-5
    severity: P3
    category: operational
    file: "apps/academia-lendaria-ads-studio (toolchain)"
    note: >-
      Supabase CLI local em v2.84.2 (mais recente v2.109.1) — não bloqueante; já
      registrado no fan-in-result.yaml.
  - id: P3-6
    severity: P3
    category: scope
    file: "apps/academia-lendaria-ads-studio/server/artifact-materializer.ts"
    note: >-
      Materializador é módulo standalone sem wiring de servidor — as ACs cobrem
      apenas o comportamento do materializador (por design da story). Exposição/
      consumo via endpoint fica para wave posterior.

