acceptance_criteria:
  story_8_W1_1:
    verdict: met
    evidence:
      AC1: "Interface ProjectRepository cobre os 6 grupos (projetos, brief revisions, artefatos, skill runs, campaign plans, weekly panels) — project-repository.ts:455-486."
      AC2: "Mappers snake<->camel explícitos e isolados (rowTo*/,*Insert) — project-repository.ts:198-449. Cliente é @/lib/supabase (anon key + JWT), service_role ausente do código e do bundle (supabase.ts:20-44)."
      AC3: "OCC por unique(project_id,revision)/unique(campaign_id,revision)/unique(campaign_id,week_start,revision); 23505 -> RevisionConflictError; revisão concorrente não sobrescrita (migration 225123:60,117,132; toRepositoryError:93-106; pgTAP teste 3)."
      AC4: "Toda query filtra workspace_id + RLS private.is_workspace_member; sem filtro de segurança reimplementado no cliente (adapter 512-726; teste 'toda query carrega workspace_id'; pgTAP testes 4/5)."
      AC5: "Migration 20260709230000 idempotente (create extension if not exists; drop trigger if exists + create). lint:db limpo."
      AC6: "pgTAP cobre CRUD, conflito de revisão e RLS +/- (project_repository.sql). Unit cobre mappers + tradução de erro (project-repository.test.ts)."
  story_8_W1_2:
    verdict: met
    evidence:
      AC1: "resolveLocalBindHost -> 127.0.0.1 default; start.ts:13 usa o resolver; bind público exige HOST explícito (local-runner-security.ts:67-70; teste AC1)."
      AC2: "Header x-local-runner-token exigido; 401 ausente / 403 inválido; timingSafeEqualStrings (SHA-256 + timingSafeEqual, sem vazar comprimento) — local-runner-security.ts:95-131; app.ts:159-167; testes 401/403/sucesso."
      AC3: "vite.config.ts lê token via loadEnv sem prefixo VITE_ e injeta no proxyReq server-side (não entra em import.meta.env/bundle); redact do header no logger Fastify (vite.config.ts:15-38; app.ts:99-104). Teste prova token ausente de stdout/stderr."
      AC4: "sanitizeCodexEnv remove OPENAI_API_KEY e CODEX_API_KEY em cópia rasa sem mutar process.env; env sanitizado passado ao spawn (local-runner-security.ts:169-175; local-skill-runner.ts:231). Teste valida ausência das chaves no filho."
      AC5: "createConcurrencyLimiter (429 fail-fast), bodyLimit por rota (413), timeout com SIGTERM->SIGKILL após killGraceMs, cleanup de temp no finally (local-skill-runner.ts:113-148,240-242; app.ts:151,174-180). Testes 429/413/release."
      AC6: "Testes: 401, 403, sucesso autorizado, 429, 413, ausência de segredo em logs, sanitização de env, loopback default, primitivas unitárias."
  story_8_W1_3:
    verdict: met
    evidence:
      AC1: "artifact-write.v1.schema.json descreve projectSlug, relativePath, format, content, expectedHash, runId, onConflict; schemaVersion const 1.0.0; additionalProperties false."
      AC2: "assertValidSlug (regex + maxLen), assertValidRelativePath (rejeita absoluto/'..'/byte nulo), resolveSafeTarget (containment sob realpath + recusa de symlink em ancestral e no alvo) — artifact-materializer.ts:108-248. Testes: slug inválido, traversal, absoluto, symlink ancestral, symlink alvo."
      AC3: "temp .{basename}.{uuid}.tmp com flag 'wx' + rename; falha faz rm do temp e canônico intacto (artifact-materializer.ts:342-355). Teste de rollback (dir read-only) confirma canônico intacto e zero .tmp."
      AC4: "sha256 + hashBefore/hashAfter + ArtifactAuditEvent serializável (roundtrip JSON) — artifact-materializer.ts:104-366; teste de auditoria."
      AC5: "mesmo hash -> unchanged (no-op); divergente + onConflict reject (default) -> conflict sem tocar canônico; overwrite substitui atomicamente (artifact-materializer.ts:315-340). Testes idempotência/conflito/overwrite."
      AC6: "20 testes: markdown, JSON/YAML válido e inválido, idempotência, conflito, traversal, absoluto, symlink (2 vetores), rollback, expectedHash match/mismatch, slug inválido, schemaVersion."

