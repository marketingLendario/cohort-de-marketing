  p3:
    - id: W23-RG5-P3-01
      severity: P3
      status: OPEN_NON_BLOCKING
      category: proposal-integrity / denial-of-service
      title: "RPC aceita hash hexadecimal fornecido pelo caller sem recomputar o payload"
      evidence: >
        private.review_skill_run_proposal valida formato, membership, relação
        projeto/workspace e CAS, mas grava p_proposal_hash sem derivá-lo de
        p_proposal. O BFF plan/approve calcula o hash canônico e o saga real
        passou sem bypass terminal; portanto não é P0/P1/P2 neste gate.
      residual_impact: "Caller autorizado pode causar hash stale/DoS temporário até nova edição; não consegue concluir done nem materializar via RPC."
      recommendation: "Recomputar/validar o hash no banco quando houver implementação canônica segura, ou manter a confiança documentada da RPC."

residual_risks:
  - "repairAll não possui claim/lease entre instâncias; pode haver trabalho redundante, com efeitos observados idempotentes/convergentes."
  - "Histórico de artefatos continua versionado por artifactId, sem unicidade global por (project_id, path); supersessão histórica por path permanece fora desta story."
  - "A RPC de revisão continua aceitando hash caller-supplied conforme W23-RG5-P3-01; o BFF é a superfície autoritativa usada pela UI e o gateway terminal exige CAS + hash."
  - "A primeira tentativa de reset terminou em 502 transitório durante restart; a repetição final do mesmo reset terminou exit 0 e os gates DB finais passaram."

