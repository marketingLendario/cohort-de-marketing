findings:
  p0: []
  p1:
    - id: W23-RG2-P1-01
      severity: P1
      category: security / filesystem boundary / tenant isolation
      title: "Slug de projeto em symlink permite leitura e escrita fora de projetos/{slug}"
      evidence:
        - file: "apps/academia-lendaria-ads-studio/server/artifact-materializer.ts"
          lines: "256-260"
          detail: "resolveSafeTarget aceita projetosRoot/{slug} como symlink, chama realpath e transforma o destino externo na nova realProjectRoot; walkRejectingSymlinks começa depois desse ponto."
        - file: "apps/academia-lendaria-ads-studio/server/artifact-materializer.ts"
          lines: "287-312"
          detail: "resolveSafeReadTarget repete o mesmo realpath do slug, permitindo que o plan leia conteúdo externo no diff."
      reproduced: "Confirmed with a temporary symlink: materializeArtifact(projectSlug: slug, relativePath: escaped.md) returned written and wrote outside/{escaped.md} outside projectsRoot."
      impact: "A boundary documentada como escrita/leitura apenas em projetos/{slug}/ pode ser redirecionada por um symlink plantado no diretório do slug; aprovação pode exfiltrar conteúdo no plan e sobrescrever arquivos arbitrários no approve."
      required_fix: "Reject the slug directory itself when lstat(projectRoot) is a symlink, while retaining only the explicitly intended projectsRoot mount/link behavior; cover both plan/read and materialize/write with regression tests."
  p2: []
  p3:
    - id: W23-RG2-P3-01
      severity: P3
      category: idempotency / test coverage
      title: "O caminho real do adapter Supabase após 23505 não tem regressão automatizada"
      evidence:
        - file: "apps/academia-lendaria-ads-studio/server/artifact-approval.ts"
          lines: "999-1007"
          detail: "create() relê por chave e depois por identidade semântica após UNIQUE_VIOLATION e retorna a linha existente."
      observed: "A read-back exata após 23505 foi exercitada por harness read-only e retornou o mesmo id; os testes versionados cobrem a semântica no store in-memory, mas não o adapter Supabase nem a corrida 23505."
      impact: "A implementação observada é correta para os cenários exercitados, mas uma regressão na cadeia Supabase poderia reabrir duplicação ou conflito sem teste específico."

