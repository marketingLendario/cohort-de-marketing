scope_handoff_W2_3:
  status: approved_and_explicit
  detail: >
    approveProposal/rejectProposal (human review decisions) remain cache-only by
    design. The done/cancelled transition from human review and the materialization
    of approved artifacts are scoped to STORY-8.W2.3 (two-phase artifact approval);
    persisting only the run status here would create an inconsistency against
    not-yet-persisted artifacts. After a reload post-approval the run still shows
    needs_review until W2.3 closes that seam. This is a KNOWN, ACCEPTED gap — not a
    regression introduced by this recovery, and NOT a blocker for this batch. QA
    explicitly approves shipping batch 1 with approve/reject persistence deferred to
    W2.3, and expects W2.3 to (1) persist the human-review terminal transition and
    (2) materialize approved artifacts durably so a post-approval reload shows done.

