  p3:
    - id: QA-W2B1-R1
      severity: P3
      story: "8.W2.2"
      category: robustness-note
      title: "Real-mode terminal persistRunUpdate is fire-and-forget (eventually-consistent, not lossy)"
      evidence:
        - "apps/academia-lendaria-ads-studio/src/components/project-journey.tsx:120 — persistRunUpdate() in real mode does `void workspaceActions.persistSkillRunUpdate(...).catch(setRuntimeError)`; the terminal onDone write (needs_review + proposal + skillHash) is not awaited."
      failure_scenario: >
        Operator reloads within the sub-second window after onDone fires but
        before repository.updateSkillRun resolves. The repo row is still
        `running`; on reload the reattach-by-jobId effect re-observes the backend
        job, whose durable journal (skill_run_jobs) is terminal, so the SSE
        snapshot re-delivers done → the terminal update is re-applied. No proposal
        is lost (the backend journal is the SOT for the proposal); the window only
        delays UI convergence by one reattach cycle.
      blast_radius: "Cosmetic/timing. Backend journal preserves the proposal; reattach reconciles. The recovery documents this reconciliation design explicitly."
      recommendation: "Optional: await the terminal persist (or mark the run needs_review optimistically then reconcile) if instant post-reload consistency is desired. Not required for AC6."
      verdict: PLAUSIBLE
    - id: QA-W2B1-05
      severity: P3
      story: "8.W2.1"
      ac: ["AC2"]
      category: ux-note
      title: "Conflict hydration state is global — one project's OCC conflict blocks the whole workspace"
      evidence:
        - "carried over from the prior gate (qa-batch-1.yaml QA-W2B1-05); untouched by the recovery. project-store.ts flagConflict sets the single hydration.status; project-hydration-boundary.tsx blocks all children on 'conflict'."
      blast_radius: "Cosmetic/UX; AC2 explicitly lists conflict as a boundary state — acceptable as designed. Note only."
      verdict: PLAUSIBLE

