findings_reverification:  # each prior finding re-tested against 602f44c
  - id: QA-W2B1-01
    prior_severity: P2
    now: CLOSED
    ac: ["AC4", "AC5"]
    requirement: "concurrent retry must yield exactly one scheduling/attempt and loser 409; UI guard must close same-client double-click"
    evidence:
      - "server/jobs/supabase-skill-job-store.ts:260 — startRetry() now UPDATEs with `.in('status', SKILL_RUN_TERMINAL_STATUSES)` + `.maybeSingle()`: atomic terminal-state CAS. Two concurrent retries both read a terminal row and compute a fresh attempt, but Postgres row-locking lets only the first UPDATE match (status→queued); the second re-evaluates the WHERE against the now-queued row → zero rows → returns undefined."
      - "server/app.ts:408-420 — POST /retry: startRetry()===undefined → get(jobId): missing → 404 SKILL_RUN_NOT_FOUND, else → 409 SKILL_RUN_RETRY_REJECTED; only the winner reaches scheduleRun() exactly once → exactly one attempt/schedule."
      - "src/components/project-journey.tsx:298-311 — retryRun() has a synchronous hard guard (retryInFlightRef.current.has(jobId) → return) set BEFORE any await/re-render, plus setRetryingJobId; the Repetir button is disabled (project-journey.tsx:478 `disabled={retryingJobId === latestJobId}`). A double-click emits a single POST."
    regression_tests:
      - "server/jobs/supabase-skill-job-store.test.ts:111 — 'two concurrent retries of a terminal job yield exactly one queued attempt; the loser is undefined'"
      - "server/jobs/supabase-skill-job-store.test.ts:133 — 'a retry of an already-retried (now queued) job is rejected (undefined)'"
      - "src/components/project-journey.test.tsx:121 — 'does not issue overlapping retry POSTs on a double-click (in-flight guard, QA-W2B1-01)'"
