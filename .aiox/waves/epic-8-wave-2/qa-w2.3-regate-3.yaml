    PARTIAL/CLOSED only for the non-racing case. Focused tests pass for plan/read
    and materialize/write when projectsRoot/{slug} is already a symlink, and a
    projectsRoot symlink remains accepted. Reopened as W23-RG3-P1-01 because the
    required no-external-read/write guarantee fails under the reproduced TOCTOU
    race.
  W23-RG2-P3-01: >
    CLOSED. Versioned adapter regression passed and returned the existing
    semantic row after UNIQUE_VIOLATION 23505.
  W23-RG-P1-01: >
    CLOSED for the artifact_approval_outbox surface: authenticated/anon direct
    access is denied, service_role is the only granted role, composite FKs reject
    cross-tenant/project/run references. Broader skill_runs authority is a new
    P1 in W23-RG3-P1-02.
  W23-RG-P1-02: >
    CLOSED in the tested gateway: CAS is needs_review -> done first, exact same
    hash is required for done replay, divergent hash does not upsert.
  W23-RG-P2-01: >
    CLOSED for canonical duplicate paths and partial multi-file repair; aliases
    normalize before hash/plan/outbox/materialization.
  W23-RG-P2-02: >
    CLOSED for lexical/semantic idempotency conflicts; divergent reuse returns
    idempotency-conflict without a side effect.
  repairAll_no_claim_lease: >
    RECHECKED, remains documented non-blocking P3 residual; duplicate work is
    possible but tested effects are idempotent/convergent.

