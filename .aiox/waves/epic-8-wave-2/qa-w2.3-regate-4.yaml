  - "Histórico de artefatos continua versionado por artifactId, sem unicidade global por (project_id, path); supersessão histórica por path permanece fora desta story."
  - "O suporte a projectsRoot como symlink/mount, O_NOFOLLOW na folha e contenção de intermediários passou nos probes source e compilado."

