findings:
  p0: []
  p1:
    - id: W23-RG4-P1-01
      severity: P1
      category: security / tenant-isolation / database-integrity
      title: "authenticated consegue criar skill_run com workspace e projeto de tenants diferentes"
      file: "apps/academia-lendaria-ads-studio/supabase/migrations/20260710120000_artifact-approval.sql"
      lines: "43-46, 87-99; 129-133"
      evidence:
        - detail: >
            A migration cria apenas índice único em
            skill_runs(id, workspace_id, project_id), não uma FK composta que
            amarre project_id ao workspace_id do projeto. A tabela mantém
            somente project_id REFERENCES marketing_projects(id).
        - detail: >
            O grant de authenticated permite INSERT de workspace_id e
            project_id, enquanto a policy herdada em
            unified_marketing_project_domain.sql:208-211 verifica apenas
            membership de workspace_id.
        - detail: >
            Reprodução real após reset fresco: sob SET LOCAL ROLE
            authenticated, membro apenas de Tenant A, INSERT de
            skill_runs(workspace_id=A, project_id=project-B, status=running)
            retornou INSERT 0 1 e a linha foi lida com os dois IDs misturados.
            A transação foi rollbackada.
      impact: >
        Um membro autenticado pode contaminar a fonte de verdade de skill_runs
        com uma identidade cross-tenant. A RPC de revisão usa membership e CAS
        sobre essa linha já inválida, e o BFF/service_role recebe uma run cujo
        projeto pertence a outro tenant; o outbox composto posteriormente falha,
        mas a inconsistência é criada antes disso e pode ser observada pelo
        tenant que controla workspace_id. Isso viola a garantia de isolamento e
        a precondição da saga, mesmo sem permitir um done direto.
      required_fix: >
        Adicionar uma FK composta em skill_runs
        (project_id, workspace_id) REFERENCES marketing_projects(id, workspace_id)
        usando o índice composto já criado, tratar/validar dados legados na
        migration e adicionar pgTAP que tente INSERT authenticated com projeto
        de outro workspace e espere 23503. Reforçar a RPC com a mesma relação
        como defesa explícita, se a política de dados exigir.
      decision: BLOCK
  p2: []
  p3:
    - id: W23-RG4-P3-01
      severity: P3
      category: proposal-integrity / denial-of-service
      title: "RPC aceita hash hexadecimal fornecido pelo caller sem recomputar o hash do payload"
      evidence:
        - file: "apps/academia-lendaria-ads-studio/supabase/migrations/20260710120000_artifact-approval.sql"
          lines: "208-223"
          detail: "A RPC valida formato, membership e CAS, mas não vincula criptograficamente p_proposal_hash a p_proposal."
        - file: "apps/academia-lendaria-ads-studio/server/artifact-approval.ts"
          lines: "509-553"
          detail: "O BFF recomputa o hash dos artifacts no plan/approve e rejeita a decisão stale/hash-mismatch; nenhum bypass terminal foi reproduzido."
      impact: >
        Um membro pode gravar temporariamente um hash falso via a RPC legítima
        e causar stale/DoS da aprovação até uma nova edição, embora não consiga
        concluir a saga nem forjar done. Não bloqueia este gate porque o BFF
        mantém a validação autoritativa da aprovação.
      recommendation: "Documentar a confiança da RPC ou validar no banco o hash canônico do payload quando o algoritmo puder ser reproduzido com segurança."

residual_risks:
