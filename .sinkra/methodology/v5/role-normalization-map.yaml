# These roles have NO on-disk persona/skill. They are NOT failures (VC-1): they are the signal that
# the forge-spec upstream needs enriched executors (new persona, runner script, or human-gate binding).
# No-Invention F7: never fabricate a persona to close a gap.
gaps_feedback_o2:
  agent:   # 7 gap(s)
    - "synapse_domain_agent"   # freq 12
    - "SYNAPSE Domain Agent"   # freq 9
    - "DigestAgent (logico)"   # freq 4
    - "harness"   # freq 3
    - "Owner Squad (squad responsável pela skill)"   # freq 1
    - "sw_synapse_injection"   # freq 1
    - "synapse_digest_event_process"   # freq 1
  worker:   # 20 gap(s)
    - "knowledge_harness_worker"   # freq 7
    - "synapse_memory_worker"   # freq 4
    - "Knowledge Harness Worker"   # freq 2
    - "static-analyzer (script)"   # freq 2
    - "*sync-ecosystem (reconciliation engine)"   # freq 1
    - "CodeRabbit"   # freq 1
    - "CodeRabbit (worker review automatizado)"   # freq 1
    - "Coolify API (worker — docker pull por digest, NUNCA git-source/SSH)"   # freq 1
    - "DedupCascadeWorker"   # freq 1
    - "KnowledgeArtifactGatewayWorker"   # freq 1
    - "KnowledgeExtractionWorker"   # freq 1
    - "log_archive_worker"   # freq 1
    - "log_capture_worker"   # freq 1
    - "log_mark_worker"   # freq 1
    - "registry-governance-check.js (worker — pre-push check)"   # freq 1
    - "Squad Engine Sync Worker"   # freq 1
    - "static-analyzer"   # freq 1
    - "synapse-engine"   # freq 1
    - "ThresholdEvaluatorWorker"   # freq 1
    - "wave-launch.js (worker automatico)"   # freq 1
  managed_agent:   # 1 gap(s)
    - "entity_agent dono-de-dominio (LEARNS_VIA fatia domain-scoped)"   # freq 1

# Gap categories (human-readable summary for the pipeline owner):
gap_categories:
  - synapse_logical_agents: agentes lógicos do SYNAPSE (synapse_domain_agent, DigestAgent, sw_synapse_injection, etc.) — sem persona slug em .claude/agents/ ou squads/*/agents/.
  - deterministic_workers: workers/scripts (knowledge_*_worker, log_*_worker, CodeRabbit, wave-launch.js, registry-governance-check.js, etc.) — runners, não personas-agent; resolução de runner é fora do escopo das 3 fontes de persona (AC-2).
  - managed_agent: entity_agent dono-de-domínio (LEARNS_VIA) — tipo não-canônico sem persona materializada.

# --- Consumption contract (AC-5: how D5 gate + resolver read this) ---
consumption_contract:
  resolver_executor_w33: >-
    O resolver (leaf_resolver) lê mappings[] por role verbatim; usa slug != "*Informação faltante*" como
    binding de executor (CX-5) traçável a resolved_via. enum_drift já normalizado (user->human, @sinkra-x->sinkra-aiox--sinkra-x).
  data_gate_d5_w54: >-
    O data-gate D5 do leaf_gerar trata um role mapeado para "*Informação faltante*" como executor
    NÃO-resolvível: a task correspondente cai em skills_pending_refinement[] (não bloqueia o leaf — VC-1).
    Um role com slug resolvido + resolved_via válido passa o gate fonte-resolvível.
  lookup_key: "mappings[].role (exact string match, verbatim do forge-spec executor.role)"
