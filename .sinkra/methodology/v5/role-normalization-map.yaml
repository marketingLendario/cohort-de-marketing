# .sinkra/methodology/v5/role-normalization-map.yaml — executor.role normalization map (V5 framework)
# STORY-181.W5.2 (forge-engine-decision-2026-06-16.md D2 + D5). LOCAL governance artifact.
# Maps each DISTINCT forge-spec executor.role (prose | @slug | /skill) -> canonical on-disk slug
# OR "*Informação faltante*" (No-Invention F7 — never invents a persona). Consumed by the D5
# data-gate (leaf_gerar W5.4) and the resolver-executor (leaf_resolver W3.3) to bind executors (CX-5).

schema_version: "1.0"
created_at: "2026-06-17"
story_ref: "docs/stories/epic-181/STORY-181.W5.2-normalize-executor-roles.md"
source_adr: "docs/architecture/sinkra-hub/forge-engine-decision-2026-06-16.md"
adr_sections: ["D2", "D5"]

# --- Contract header (AC-5: consumable by the gate + resolver) ---
source:
  forge_spec: ".sinkra/state/br-sinkra-hub-stem-20260612/sinkra-output.json"
  pi1_readonly: true   # AC-4 — forge-spec is NEVER mutated; this map is a lateral artifact
  schema_version: "5.1.0"

reuse:
  # IDS REUSE (Dev Notes): the resolver-executor W3.3 model was reused for the 4 canonical
  # executor_types, the selection_function (STEP1 classify), and enum_drift_flags (user->human).
  raci_resolver_model: ".sinkra/extraction/capabilities-raci-resolver-2026-06-15/raci-resolver-model.json"
  reused: ["executor_types", "selection_function", "enum_drift_flags"]

consumed_by:
  # Mirrors raci-resolver-model.json consumed_by (AC-5).
  - resolver_executor: ".claude/skills/sinkra-squad-creator-resolver-executor/SKILL.md"   # leaf_resolver (W3.3)
  - data_gate_d5: ".claude/skills/sinkra-squad-creator-gerar/SKILL.md"                     # leaf_gerar (W5.4)

# Canonical 4 executor types (reused from raci-resolver-model.json executor_types).
# Note: forge-spec also carries a non-canonical 'managed_agent' type (2 refs) — surfaced as-is
# in mappings[].executor_type for fidelity; canonical SINKRA executors are: human | agent | clone | worker.
executor_types_canonical: ["human", "agent", "clone", "worker"]

# --- Coverage (AC-3: resolved/total + explicit gaps = O2 feedback-loop) ---
# Dois escopos são reportados (NÃO há drift do spec — ver scope_note):
#   - executor_role_strict: o escopo que a story pede (apenas executor.role) = 48 distinct / 124 refs (CONFIRMA o claim original).
#   - all_role_superset: toda chave .role do spec (executor.role + RACI responsible/accountable/consulted/informed) = 71 / 388.
# Os campos top-level resolved/informacao_faltante abaixo referem-se ao SUPERSET (as 71 entradas de mappings[]).
coverage:
  scope_note: >-
    A story pede normalizar `executor.role`. O escopo ESTRITO on-disk = 48 roles distintos / 124 refs —
    o que CONFIRMA o claim original da story (AC/Contexto). A diferença entre 48 e 71 é apenas o ESCOPO da
    contagem (executor.role vs todas as chaves `.role`), não uma alteração do forge-spec. Este
    mapa usa um SUPERSET deliberado = 71 roles distintos / 388 refs (todas as chaves `.role` do spec:
    executor.role + papéis RACI responsible/accountable/consulted/informed) para cobertura conservadora e
    para também servir o resolver-executor (W3.3, que consome RACI). Os 48 executor.role estão integralmente
    cobertos pelo superset (0 ausentes do mapa).
  executor_role_strict:    # AC-3 "X/48" — o escopo que a story pede (apenas executor.role)
    distinct: 48
    refs: 124
    resolved: 29
    informacao_faltante: 19
  all_role_superset:       # o escopo efetivo deste mapa (mappings[] tem 71 entradas)
    distinct: 71
    refs: 388
    resolved: 43
    informacao_faltante: 28
  total_distinct_roles: 71   # = all_role_superset.distinct (as 71 entradas de mappings[] abaixo)
  total_role_refs: 388
  resolved: 43               # superset
  informacao_faltante: 28    # superset
  executor_type_counts:
    human: 223
    agent: 132
    worker: 31
    managed_agent: 2

