status_machine:
  description: Schema auxiliar do campo status_machine em branch_process / entity_branch (não é um entity_type).
  fields:
    - name: states
      type: array
      items: string
    - name: transitions
      type: array
      items:
        from: string
        to: string
        trigger: string
    - name: initial_state
      type: string
